name: cineize

services:
  api:
    build:
      context: api/
      target: runner
    image: api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "5002:5000"
    networks:
      - cineize
      - xservices_net

networks:
  cineize:
    driver: bridge
  xservices_net:
    external: true
